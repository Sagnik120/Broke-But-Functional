<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Broke But Functional — make ₹10,000 last 30 days. Simulate spending, subscriptions, savings and surprise expenses before you commit, and watch your balance, daily allowance, forecast, risk and financial health react."
    />
    <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Broke But Functional" />
    <meta
      property="og:description"
      content="Make ₹10,000 last 30 days. Simulate any money decision and see what it does to your whole month."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Broke But Functional — ₹10,000, 30 days, zero panic</title>
  </head>
  <body>
    <noscript>Broke But Functional needs JavaScript enabled to run your budget simulation.</noscript>
    <div id="root">
      <!-- Static shell: paints before JavaScript runs and is replaced when the app mounts. -->
      <div class="boot" role="status">
        <svg class="boot__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <rect class="boot__page" x="6" y="3" width="36" height="42" rx="8" pathLength="1" />
          <line class="boot__margin" x1="15" y1="4" x2="15" y2="44" pathLength="1" />
          <line class="boot__rule" x1="20" y1="17" x2="36" y2="17" pathLength="1" />
          <line class="boot__rule" x1="20" y1="25" x2="36" y2="25" pathLength="1" />
          <line class="boot__rule" x1="20" y1="33" x2="30" y2="33" pathLength="1" />
        </svg>
        <p class="boot__brand">Broke But Functional</p>
        <p class="boot__line" aria-hidden="true"></p>
        <p>Opening your ledger…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
